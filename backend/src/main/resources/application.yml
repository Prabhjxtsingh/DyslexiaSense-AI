server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: dyslexiasense-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/dyslexiasense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:dyslexiasense}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  ml:
    base-url: ${ML_API_URL:http://localhost:8000}
